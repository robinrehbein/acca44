name: Prototype checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: acca44
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d acca44"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      VENDURE_DISABLE_TELEMETRY: "true"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: acca44
      DB_USERNAME: postgres
      DB_PASSWORD: ci-database-trust-only
      SUPERADMIN_USERNAME: admin@acca44.example
      ASSET_UPLOAD_DIR: /tmp/acca44-ci-assets
      TEST_ALLOW_MUTATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Generate ephemeral test credentials
        run: |
          node - <<'NODE'
          const fs = require('fs'), crypto = require('crypto');
          for (const key of ['SUPERADMIN_PASSWORD', 'COOKIE_SECRET', 'DEMO_OPERATOR_PASSWORD']) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${crypto.randomBytes(32).toString('hex')}\n`);
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate -w @acca44/server
      - run: npm run seed -w @acca44/server
      - name: Real API integration checks
        run: |
          npm run start -w @acca44/server > /tmp/acca44-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'content-type: application/json' --data '{"query":"{__typename}"}' http://localhost:3001/shop-api >/dev/null; then break; fi
            sleep 1
          done
          node tests/integration.mjs
