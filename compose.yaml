name: acca44-prototype
x-server: &server
  build:
    context: .
    dockerfile: Dockerfile.server
  environment: &server-env
    NODE_ENV: production
    VENDURE_DISABLE_TELEMETRY: "true"
    PORT: 3001
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${POSTGRES_DB:-acca44}
    DB_USERNAME: ${POSTGRES_USER:-acca44}
    DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
    COOKIE_SECRET: ${SERVICE_PASSWORD_64_COOKIE:?}
    SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin@acca44.example}
    SUPERADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN:?}
    DEMO_OPERATOR_PASSWORD: ${SERVICE_PASSWORD_64_OPERATOR:?}
    ASSET_UPLOAD_DIR: /app/assets
    ASSET_URL_PREFIX: ${SERVICE_URL_SERVER_3001:-https://api.acca44.robinrehbein.de}/assets/
    STOREFRONT_ORIGIN: ${SERVICE_URL_STOREFRONT_3000:-https://acca44.robinrehbein.de}
  volumes:
    - assets:/app/assets
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    mem_limit: 768m
    cpus: 1.0
    image: postgres:16.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acca44}
      POSTGRES_USER: ${POSTGRES_USER:-acca44}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port: the database is available only on the Compose network.
  server:
    <<: *server
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3001"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/shop-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{ __typename }'})}).then(async r=>{if(!r.ok || !(await r.json()).data)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
  worker:
    <<: *server
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [npm, run, "start:worker", -w, "@acca44/server"]
    restart: unless-stopped
  storefront:
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: Dockerfile.storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      VENDURE_SHOP_API_URL: http://server:3001/shop-api
      PUBLIC_STOREFRONT_URL: ${SERVICE_URL_STOREFRONT_3000:-https://acca44.robinrehbein.de}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: 1
    expose: ["3000"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  migrate:
    <<: *server
    mem_limit: 1g
    cpus: 1.0
    command: [npm, run, migrate, -w, "@acca44/server"]
    restart: "no"

volumes:
  postgres-data:
  assets:
